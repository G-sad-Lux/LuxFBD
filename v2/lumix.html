<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumix | Asistente de Soporte</title>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://aftrxnerszxjfjxegjuk.supabase.co; connect-src 'self' https://aftrxnerszxjfjxegjuk.supabase.co wss://aftrxnerszxjfjxegjuk.supabase.co ws://127.0.0.1:5173 ws://localhost:5173; object-src 'none'; base-uri 'self'; form-action 'self'">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        /* Chat Lumix (pantalla 02): móvil primero; en escritorio, columna centrada */
        html, body { height: 100%; }
        body { display: flex; flex-direction: column; background: var(--v2-bg); }
        .lumix-app { flex: 1; display: flex; flex-direction: column; max-width: 480px; width: 100%; margin: 0 auto; background: var(--v2-bg); min-height: 0; }
        @media (min-width: 520px) { .lumix-app { margin: 16px auto; border-radius: 18px; overflow: hidden; border: 1px solid var(--v2-border); min-height: calc(100vh - 32px); max-height: calc(100vh - 32px); box-shadow: 0 10px 40px rgba(11, 31, 77, .08); } }

        .lumix-head { display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 4px; background: var(--v2-card); border-bottom: 1px solid #e1e7f0; flex-shrink: 0; }
        .lumix-head .volver { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--v2-heading); }
        .lumix-head .avatar { position: relative; flex-shrink: 0; }
        .lumix-head .avatar img { width: 42px; height: 42px; border-radius: 50%; background: #ddf1f6; object-fit: cover; display: block; }
        .lumix-head .avatar .punto { position: absolute; right: 0; bottom: 1px; width: 11px; height: 11px; border-radius: 50%; background: var(--v2-ok); border: 2px solid #fff; }
        .lumix-head .quien { flex: 1; min-width: 0; line-height: 1.25; }
        .lumix-head .quien strong { font-size: 16px; color: var(--v2-heading); display: block; }
        .lumix-head .quien small { font-size: 12px; color: #1f7a45; font-weight: 600; }
        .lumix-head .reiniciar { width: 44px; height: 44px; border: 0; background: transparent; color: var(--v2-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 10px; font: inherit; }
        .lumix-head .reiniciar:hover { background: #eef2f8; }

        .lumix-msgs { flex: 1; overflow-y: auto; padding: 16px 14px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
        .dia { align-self: center; font-size: 11px; font-weight: 700; color: var(--v2-muted); background: #e4e9f1; border-radius: 999px; padding: 4px 10px; }

        .fila-bot { display: flex; gap: 8px; align-items: flex-end; max-width: 92%; }
        .fila-bot .ava { width: 30px; height: 30px; border-radius: 50%; background: #ddf1f6; object-fit: cover; flex-shrink: 0; }
        .msg-bot { background: var(--v2-card); border: 1px solid #e1e7f0; border-radius: 4px 16px 16px 16px; padding: 10px 13px; font-size: 14px; line-height: 1.45; color: var(--v2-text); white-space: pre-wrap; overflow-wrap: anywhere; }
        .msg-user { align-self: flex-end; background: var(--v2-primary); color: #fff; border-radius: 16px 4px 16px 16px; padding: 10px 13px; font-size: 14px; line-height: 1.45; max-width: 78%; white-space: pre-wrap; overflow-wrap: anywhere; }
        .hora { font-size: 11px; color: var(--v2-subtle); margin-top: 4px; }
        .hora.der { align-self: flex-end; display: flex; gap: 4px; align-items: center; }
        .hora.der .v2-ico { color: var(--v2-primary); }

        .chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-left: 38px; }
        .chips.una { grid-template-columns: minmax(0, 1fr); }
        .chips button, .chips a {
            min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 8px 10px; border: 1px solid #bfd0ee; border-radius: 12px;
            background: var(--v2-card); color: var(--v2-primary-dark);
            font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none;
        }
        .chips button:hover, .chips a:hover { background: #eaf1fc; }
        .chips .principal { background: var(--v2-primary); border-color: var(--v2-primary); color: #fff; }
        .chips .principal:hover { background: var(--v2-primary-dark); color: #fff; }
        .chips.usadas button, .chips.usadas a { opacity: .45; pointer-events: none; }

        /* Resumen para confirmar (paso nuevo) */
        .kv { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 4px 10px; font-size: 13px; margin: 0; padding: 10px 12px; background: #f4f7fc; border-radius: 10px; }
        .kv dt { color: var(--v2-muted); }
        .kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }

        /* Tarjeta de éxito */
        .card-exito { background: var(--v2-card); border: 1px solid #bfe3cc; border-radius: 16px; padding: 14px; display: flex; gap: 12px; align-items: flex-start; margin-left: 38px; }
        .card-exito .circulo { width: 36px; height: 36px; border-radius: 50%; background: var(--v2-ok); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .card-exito .folio { font-size: 20px; font-weight: 800; color: var(--v2-heading); letter-spacing: -0.2px; }
        .card-exito p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--v2-muted); }

        /* Consultar estado: tarjetas compactas */
        .mini-ticket { margin-left: 38px; background: var(--v2-card); border: 1px solid var(--v2-border); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; }
        .mini-ticket.esperando { border-color: #f2c48d; box-shadow: 0 0 0 1px #f2c48d; }
        .mini-ticket .linea1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .mini-ticket .linea1 strong { color: var(--v2-heading); flex-shrink: 0; }
        .mini-ticket .linea1 .tit { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .mini-ticket .linea1 .v2-badge { flex-shrink: 0; }
        .mini-ticket .sub { font-size: 12px; color: var(--v2-muted); }
        .mini-ticket .falta { font-size: 12px; color: var(--v2-internal-text); background: var(--v2-internal-bg); border-radius: 8px; padding: 6px 8px; }

        /* Barra inferior en pill */
        .lumix-input { display: flex; align-items: center; gap: 8px; padding: 10px 12px 14px; background: var(--v2-card); border-top: 1px solid #e1e7f0; flex-shrink: 0; }
        .lumix-input .pill { flex: 1; display: flex; align-items: center; gap: 4px; height: 48px; padding: 0 6px 0 14px; border: 1px solid var(--v2-border-strong); border-radius: 999px; background: #f7f9fc; min-width: 0; }
        .lumix-input .pill input[type="text"] { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: var(--v2-text); }
        .lumix-input .pill button { width: 36px; height: 36px; border: 0; background: transparent; color: var(--v2-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%; padding: 0; font: inherit; }
        .lumix-input .pill button:disabled { opacity: .35; cursor: default; }
        .lumix-input .enviar { width: 48px; height: 48px; border-radius: 50%; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; background: #9db0d3; flex-shrink: 0; padding: 0; font: inherit; }
        .lumix-input .enviar.activo { background: var(--v2-primary); }
        .lumix-input .enviar:disabled { cursor: default; }

        /* Acceso sin sesión */
        .lumix-login { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px 20px; text-align: center; }
        .lumix-login img { width: 132px; height: auto; }
        .lumix-login h1 { margin: 0; font-size: 24px; font-weight: 800; color: var(--v2-heading); }
        .lumix-login p { margin: 0; font-size: 14px; color: var(--v2-muted); max-width: 300px; }
        .lumix-login form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; text-align: left; }
    </style>
</head>

<body>
    <div class="lumix-app">
        <header class="lumix-head">
            <a class="volver" href="alumnos.html" aria-label="Volver al portal"><span data-ico="ui.atras" data-tam="grande"></span></a>
            <div class="avatar">
                <img src="assets/lumix-avatar.png" alt="">
                <span class="punto"></span>
            </div>
            <div class="quien"><strong>Lumix</strong><small>En línea · Soporte Universidad Lux</small></div>
            <button type="button" id="btn-reiniciar" class="reiniciar" aria-label="Reiniciar conversación" hidden><span data-ico="ui.historial"></span></button>
        </header>

        <div class="lumix-msgs" id="msgs"></div>

        <form class="lumix-input" id="barra" hidden>
            <div class="pill">
                <label for="texto" style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);">Mensaje para Lumix</label>
                <input type="text" id="texto" placeholder="Escribe un mensaje…" maxlength="5000" autocomplete="off" disabled>
                <button type="button" id="btn-adjuntar" aria-label="Adjuntar archivo" disabled><span data-ico="ui.clip"></span></button>
                <button type="button" id="btn-camara" aria-label="Tomar foto" disabled><span data-ico="ui.camara"></span></button>
            </div>
            <button type="submit" class="enviar" id="btn-enviar" aria-label="Enviar mensaje" disabled><span data-ico="ui.enviar"></span></button>
            <input type="file" id="archivo" accept="image/png,image/jpeg,application/pdf" hidden>
            <input type="file" id="camara" accept="image/png,image/jpeg" capture="environment" hidden>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"
        integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF"
        crossorigin="anonymous"></script>
    <script src="../config.js"></script>
    <script src="iconos.js"></script>
    <script src="shared.js"></script>
    <script>
        (async function () {
            if (!LuxV2.requireV2()) return;

            const esc = LuxV2.esc;
            const $ = (id) => document.getElementById(id);
            const { svgIcono, iconoCategoria, fmtHora, fmtFecha, nombreDe } = LuxV2.ui;
            const msgs = $('msgs'), texto = $('texto'), btnEnviar = $('btn-enviar'),
                btnAdjuntar = $('btn-adjuntar'), btnCamara = $('btn-camara'),
                archivo = $('archivo'), camara = $('camara'), barra = $('barra');

            document.querySelectorAll('[data-ico]').forEach(el => {
                el.innerHTML = svgIcono(el.dataset.ico, el.dataset.tam || '');
            });

            // Respaldo estático por si catalog-service no responde (mismos IDs de la semilla)
            const CATS_FALLBACK = [
                { catalogo_id: 37, nombre: 'Acceso y bloqueos', codigo: 'acceso' }, { catalogo_id: 34, nombre: 'Plataforma virtual', codigo: 'plataforma' },
                { catalogo_id: 36, nombre: 'Materias', codigo: 'materias' }, { catalogo_id: 42, nombre: 'Servicios escolares', codigo: 'servicios_escolares' },
                { catalogo_id: 33, nombre: 'Finanzas y pagos', codigo: 'finanzas' }, { catalogo_id: 35, nombre: 'Otros', codigo: 'otros' },
            ];
            const AREAS_FALLBACK = [
                { catalogo_id: 38, nombre: 'Soporte Técnico' }, { catalogo_id: 39, nombre: 'Servicios Escolares' },
                { catalogo_id: 40, nombre: 'Cajas' }, { catalogo_id: 41, nombre: 'Administración' },
            ];

            // Maquina de estados del asistente (formato chatbot: NO cambiar a formularios).
            // Orden §5.3 del doc V2 + resumen de confirmación (diseño 02):
            // titulo -> categoria -> detalles -> area -> evidencia -> RESUMEN -> crear.
            // Sin pregunta de prioridad (§10): la fija soporte.
            const state = { step: 'INIT', ticket: {}, catalogs: null, subiendo: false, perfil: null };

            // ---------- primitivas de chat ----------
            function burbujaBot(textoMsg, extraHtml) {
                const fila = document.createElement('div');
                fila.className = 'fila-bot';
                const cuerpo = document.createElement('div');
                cuerpo.style.minWidth = '0';
                const b = document.createElement('div');
                b.className = 'msg-bot';
                b.textContent = textoMsg;
                if (extraHtml) {
                    b.style.display = 'flex'; b.style.flexDirection = 'column'; b.style.gap = '10px';
                    const extra = document.createElement('div');
                    extra.innerHTML = extraHtml;
                    b.appendChild(extra);
                }
                const hora = document.createElement('div');
                hora.className = 'hora';
                hora.textContent = fmtHora(new Date());
                cuerpo.appendChild(b); cuerpo.appendChild(hora);
                fila.innerHTML = '<img class="ava" src="assets/lumix-avatar.png" alt="">';
                fila.appendChild(cuerpo);
                msgs.appendChild(fila);
                msgs.scrollTop = msgs.scrollHeight;
                return b;
            }
            function burbujaUser(textoMsg) {
                const b = document.createElement('div');
                b.className = 'msg-user';
                b.textContent = textoMsg;
                msgs.appendChild(b);
                const hora = document.createElement('div');
                hora.className = 'hora der';
                hora.innerHTML = esc(fmtHora(new Date())) + svgIcono('ui.check', 'chica');
                msgs.appendChild(hora);
                msgs.scrollTop = msgs.scrollHeight;
                return b;
            }
            function chips(opciones, principalValue) {
                const c = document.createElement('div');
                c.className = 'chips' + (opciones.length === 1 ? ' una' : '');
                opciones.forEach(op => {
                    let el;
                    if (op.href) {
                        el = document.createElement('a');
                        el.href = op.href;
                    } else {
                        el = document.createElement('button');
                        el.type = 'button';
                        el.addEventListener('click', () => {
                            c.classList.add('usadas'); // las opciones ya usadas se apagan
                            manejar(op.value, op.label);
                        });
                    }
                    if (op.icono) el.innerHTML = op.icono + '<span></span>';
                    (op.icono ? el.lastChild : el).textContent = op.label;
                    if (op.value === principalValue || op.principal) el.classList.add('principal');
                    c.appendChild(el);
                });
                msgs.appendChild(c);
                msgs.scrollTop = msgs.scrollHeight;
                return c;
            }
            function habilitarTexto(si, conAdjunto) {
                texto.disabled = !si;
                btnEnviar.disabled = !si;
                btnEnviar.classList.toggle('activo', !!si && texto.value.trim() !== '');
                btnAdjuntar.disabled = !conAdjunto;
                btnCamara.disabled = !conAdjunto;
                if (si) texto.focus();
            }
            texto.addEventListener('input', () => {
                btnEnviar.classList.toggle('activo', texto.value.trim() !== '');
            });
            function apagarChipsPrevios() {
                msgs.querySelectorAll('.chips:not(.usadas)').forEach(c => c.classList.add('usadas'));
            }
            function diaChip() {
                const d = document.createElement('div');
                d.className = 'dia';
                d.textContent = 'Hoy';
                msgs.appendChild(d);
            }

            // ---------- pasos ----------
            function prompt(step) {
                state.step = step;
                habilitarTexto(false, false);
                switch (step) {
                    case 'GREETING': {
                        state.ticket = {};
                        const nombre = state.perfil ? state.perfil.nombre : '';
                        burbujaBot('¡Hola' + (nombre ? ', ' + nombre : '') + '! Soy Lumix, tu asistente de soporte. ¿En qué puedo ayudarte hoy?');
                        chips([
                            { label: 'Reportar un problema', value: 'report', principal: true },
                            { label: 'Consultar mi ticket', value: 'status' },
                        ]);
                        break;
                    }
                    case 'TITLE':
                        burbujaBot('De acuerdo. Escribe un título breve que resuma tu problema (mínimo 5 letras).');
                        habilitarTexto(true, false);
                        break;
                    case 'CATEGORY': {
                        burbujaBot('¿Qué tipo de problema es?');
                        const cats = (state.catalogs && state.catalogs.categorias.length ? state.catalogs.categorias : CATS_FALLBACK);
                        chips(cats.map(c => ({
                            label: c.nombre, value: 'cat:' + c.catalogo_id,
                            icono: iconoCategoria(c.codigo || c.nombre, 'media'),
                        })));
                        break;
                    }
                    case 'DETAILS':
                        burbujaBot('Describe con detalle qué ocurre: qué intentabas hacer, desde cuándo y qué mensaje aparece (mínimo 15 letras).');
                        habilitarTexto(true, false);
                        break;
                    case 'AREA': {
                        burbujaBot('¿Con qué área crees que está relacionado? Si no estás seguro, el equipo de soporte lo definirá.');
                        const areas = (state.catalogs && state.catalogs.areas.length ? state.catalogs.areas : AREAS_FALLBACK);
                        chips(areas.map(a => ({ label: a.nombre, value: 'area:' + a.catalogo_id }))
                            .concat([{ label: 'No estoy seguro', value: 'area:auto' }]));
                        break;
                    }
                    case 'EVIDENCE':
                        burbujaBot('Puedes agregar una evidencia para ayudarnos a revisar tu caso: captura de pantalla, foto o PDF (máx. 5 MB).');
                        habilitarTexto(false, true);
                        chips([
                            { label: 'Adjuntar archivo', value: 'adjuntar', icono: svgIcono('ui.clip', 'media') },
                            { label: 'Tomar foto', value: 'foto', icono: svgIcono('ui.camara', 'media') },
                            { label: 'Continuar sin evidencia', value: 'sin_adjunto' },
                        ]);
                        break;
                    case 'RESUMEN': {
                        const t = state.ticket;
                        const catNombre = (state.catalogs && state.catalogs.categorias || CATS_FALLBACK)
                            .concat(CATS_FALLBACK).find(c => c.catalogo_id === t.categoria_id);
                        const areaNombre = t.area_id
                            ? ((state.catalogs && state.catalogs.areas || AREAS_FALLBACK).concat(AREAS_FALLBACK).find(a => a.catalogo_id === t.area_id) || {}).nombre
                            : 'La define soporte';
                        burbujaBot('Revisa el resumen de tu reporte:',
                            '<dl class="kv">' +
                            '<dt>Título</dt><dd>' + esc(t.titulo) + '</dd>' +
                            '<dt>Categoría</dt><dd>' + esc(catNombre ? catNombre.nombre : '—') + '</dd>' +
                            '<dt>Área</dt><dd>' + esc(areaNombre) + '</dd>' +
                            '<dt>Evidencia</dt><dd>' + esc(t.adjunto ? t.adjunto.nombre_archivo : 'Sin evidencia') + '</dd>' +
                            '</dl>' +
                            '<span style="font-size:12px; color:var(--v2-muted);">La prioridad la asigna el equipo de soporte según las reglas de la universidad.</span>');
                        chips([
                            { label: 'Confirmar y enviar', value: 'confirmar', principal: true },
                            { label: 'Empezar de nuevo', value: 'reiniciar' },
                        ]);
                        break;
                    }
                }
            }

            async function manejar(valor, etiqueta) {
                if (state.subiendo) return;
                switch (state.step) {
                    case 'GREETING':
                        if (valor === 'report') { burbujaUser(etiqueta || 'Reportar un problema'); prompt('TITLE'); }
                        else if (valor === 'status') { burbujaUser(etiqueta || 'Consultar mi ticket'); consultarEstado(); }
                        break;
                    case 'TITLE': {
                        const t = String(valor).trim();
                        if (!t) return;
                        if (t.length < 5) { burbujaUser(t); texto.value = ''; burbujaBot('El título es muy corto: dame al menos 5 letras.'); habilitarTexto(true, false); return; }
                        state.ticket.titulo = t;
                        burbujaUser(t); texto.value = '';
                        prompt('CATEGORY');
                        break;
                    }
                    case 'CATEGORY':
                        if (String(valor).startsWith('cat:')) {
                            state.ticket.categoria_id = Number(String(valor).slice(4));
                            burbujaUser(etiqueta);
                            prompt('DETAILS');
                        }
                        break;
                    case 'DETAILS': {
                        const d = String(valor).trim();
                        if (!d) return;
                        if (d.length < 15) { burbujaUser(d); texto.value = ''; burbujaBot('Necesito un poco más de detalle (mínimo 15 letras) para ayudarte mejor.'); habilitarTexto(true, false); return; }
                        state.ticket.detalles = d;
                        burbujaUser(d); texto.value = '';
                        prompt('AREA');
                        break;
                    }
                    case 'AREA':
                        if (String(valor).startsWith('area:')) {
                            const v = String(valor).slice(5);
                            state.ticket.area_id = v === 'auto' ? null : Number(v);
                            burbujaUser(etiqueta);
                            prompt('EVIDENCE');
                        }
                        break;
                    case 'EVIDENCE':
                        if (valor === 'adjuntar') { archivo.click(); }
                        else if (valor === 'foto') { camara.click(); }
                        else if (valor === 'sin_adjunto') { burbujaUser('Continuar sin evidencia'); prompt('RESUMEN'); }
                        break;
                    case 'RESUMEN':
                        if (valor === 'confirmar') { burbujaUser('Confirmar y enviar'); crearTicket(); }
                        else if (valor === 'reiniciar') { reiniciar(); }
                        break;
                    case 'DONE':
                        if (valor === 'report') { apagarChipsPrevios(); burbujaUser('Reportar otro problema'); state.ticket = {}; prompt('TITLE'); }
                        else if (valor === 'status') { apagarChipsPrevios(); burbujaUser('Consultar mi ticket'); consultarEstado(); }
                        break;
                }
            }

            // ---------- evidencia (sube al bucket privado, guarda la ruta) ----------
            async function procesarArchivo(f) {
                const tipos = ['image/png', 'image/jpeg', 'application/pdf'];
                if (!tipos.includes(f.type)) { burbujaBot('Ese formato no está permitido: usa PNG, JPG o PDF.'); return; }
                if (f.size > 5 * 1024 * 1024) { burbujaBot('El archivo pesa más de 5 MB. Comprime la imagen o recorta el PDF.'); return; }

                state.subiendo = true;
                const aviso = burbujaBot('Subiendo ' + f.name + '…');
                try {
                    const session = await LuxV2.getSession();
                    const limpio = f.name.replace(/[^\w.-]/g, '');
                    const ruta = session.user.id + '/' + Date.now() + '_' + limpio;
                    const { error } = await LuxV2.sb().storage.from('tickets').upload(ruta, f);
                    if (error) throw error;
                    state.ticket.adjunto = { nombre_archivo: f.name, ruta_archivo_url: ruta, mime_type: f.type, size_bytes: f.size };
                    aviso.textContent = 'Evidencia lista: ' + f.name;
                    state.subiendo = false;
                    apagarChipsPrevios();
                    burbujaUser('Adjunté "' + f.name + '"');
                    prompt('RESUMEN');
                } catch (e) {
                    console.error(e);
                    state.subiendo = false;
                    aviso.textContent = 'No pude subir el archivo. Intenta de nuevo o continúa sin evidencia.';
                }
            }
            archivo.addEventListener('change', () => { if (archivo.files.length) { const f = archivo.files[0]; archivo.value = ''; procesarArchivo(f); } });
            camara.addEventListener('change', () => { if (camara.files.length) { const f = camara.files[0]; camara.value = ''; procesarArchivo(f); } });

            // ---------- crear ticket ----------
            async function crearTicket() {
                state.step = 'CREANDO';
                habilitarTexto(false, false);
                burbujaBot('Registrando tu reporte…');
                try {
                    const body = {
                        titulo: state.ticket.titulo,
                        categoria_id: state.ticket.categoria_id,
                        detalles: state.ticket.detalles,
                        canal_entrada: 'chatbot',
                        adjunto: state.ticket.adjunto || null,
                    };
                    if (state.ticket.area_id) body.area_notificada_id = state.ticket.area_id;
                    const t = await LuxV2.callFn('ticket-manager/create', { method: 'POST', body });

                    const card = document.createElement('div');
                    card.className = 'card-exito';
                    card.innerHTML =
                        '<span class="circulo">' + svgIcono('ui.check') + '</span>' +
                        '<div style="display:flex; flex-direction:column; gap:6px; min-width:0;">' +
                        '<strong style="font-size:14px; color:var(--v2-heading);">Reporte registrado correctamente</strong>' +
                        '<span class="folio">Ticket #' + esc(t.ticket_id) + '</span>' +
                        '<span class="v2-badge st-abierto" style="align-self:flex-start;">Estado: Abierto</span>' +
                        '<p>Recibimos tu reporte. El equipo de soporte lo revisará y te avisaremos de cada avance aquí y en Mis Tickets.</p>' +
                        (t.eta_estimada ? '<p><strong>Atención estimada para:</strong> ' + esc(fmtFecha(t.eta_estimada)) + '</p>' : '') +
                        '<span class="hora" style="margin:0;">' + esc(fmtHora(new Date())) + '</span>' +
                        '</div>';
                    msgs.appendChild(card);
                    msgs.scrollTop = msgs.scrollHeight;

                    state.step = 'DONE';
                    chips([
                        { label: 'Ver en Mis Tickets', href: 'alumnos.html#ticket=' + t.ticket_id, principal: true },
                        { label: 'Reportar otro problema', value: 'report' },
                    ]);
                } catch (err) {
                    console.error(err);
                    burbujaBot('No pude registrar el ticket: ' + err.message);
                    state.step = 'RESUMEN';
                    chips([
                        { label: 'Reintentar', value: 'confirmar', principal: true },
                        { label: 'Ir a Mis Tickets', href: 'alumnos.html' },
                    ]);
                }
            }

            // ---------- consultar estado (02d) ----------
            async function consultarEstado() {
                state.step = 'DONE';
                burbujaBot('Déjame revisar tus tickets…');
                try {
                    const tickets = await LuxV2.callFn('ticket-manager/list');
                    if (tickets.length === 0) {
                        burbujaBot('Aún no tienes tickets registrados. ¿Reportamos tu primer problema?');
                    } else {
                        const activos = tickets.filter(t => ![4, 5].includes(t.estado_id));
                        const lista = (activos.length ? activos : tickets).slice(0, 4);
                        burbujaBot(activos.length
                            ? 'Tienes ' + activos.length + ' ticket(s) activo(s):'
                            : 'No tienes tickets activos; estos son los más recientes:');

                        // Para los "Esperando respuesta": qué información pidió soporte
                        const faltantes = {};
                        await Promise.all(lista.filter(t => t.estado_id === 3).slice(0, 3).map(async t => {
                            try {
                                const det = await LuxV2.callFn('ticket-manager/details?id=' + t.ticket_id);
                                const staffMsgs = (det.comments || [])
                                    .filter(c => c.autor && LuxV2.STAFF_ROLES.includes(c.autor.tipo_usuario))
                                    .sort((a, b) => new Date(a.fecha_creacion) - new Date(b.fecha_creacion));
                                if (staffMsgs.length) faltantes[t.ticket_id] = staffMsgs[staffMsgs.length - 1].contenido;
                            } catch (_) { /* sin detalle: la tarjeta sale sin la línea */ }
                        }));

                        lista.forEach(t => {
                            const a = document.createElement('a');
                            a.className = 'mini-ticket' + (t.estado_id === 3 ? ' esperando' : '');
                            a.href = 'alumnos.html#ticket=' + t.ticket_id;
                            const estadoNombre = t.estado ? t.estado.nombre : '—';
                            const codigo = estadoNombre.toLowerCase().replace(/\s+/g, '_');
                            a.innerHTML =
                                '<div class="linea1"><strong>#' + t.ticket_id + '</strong><span class="tit"></span>' +
                                '<span class="v2-badge st-' + esc(codigo) + '" style="height:22px; font-size:11px;">' + esc(estadoNombre) + '</span></div>' +
                                '<span class="sub"></span>' +
                                (faltantes[t.ticket_id] ? '<span class="falta"></span>' : '');
                            a.querySelector('.linea1 .tit').textContent = t.titulo;
                            a.querySelector('.sub').textContent =
                                (t.catalogo ? t.catalogo.nombre : '') +
                                (t.asignado ? ' · Atiende ' + nombreDe(t.asignado) : ' · Sin asignar') +
                                (t.area ? ' · ' + t.area.nombre : '');
                            if (faltantes[t.ticket_id]) a.querySelector('.falta').textContent = 'Soporte necesita: ' + faltantes[t.ticket_id];
                            msgs.appendChild(a);
                        });
                        msgs.scrollTop = msgs.scrollHeight;
                        if (tickets.length > lista.length) burbujaBot('…y ' + (tickets.length - lista.length) + ' más en Mis Tickets.');
                    }
                } catch (e) {
                    console.error(e);
                    burbujaBot('No pude consultar tus tickets en este momento.');
                }
                burbujaBot('¿Algo más?');
                chips([
                    { label: 'Reportar un problema', value: 'report', principal: true },
                    { label: 'Ver Mis Tickets', href: 'alumnos.html' },
                ]);
            }

            // ---------- reiniciar ----------
            function reiniciar() {
                if (state.subiendo) return;
                msgs.innerHTML = '';
                state.ticket = {};
                texto.value = '';
                diaChip();
                prompt('GREETING');
            }
            $('btn-reiniciar').addEventListener('click', () => {
                if (state.step !== 'GREETING' && !confirm('¿Reiniciar la conversación? Se pierde el reporte a medio llenar.')) return;
                reiniciar();
            });

            // ---------- wiring ----------
            barra.addEventListener('submit', (e) => { e.preventDefault(); if (!texto.disabled) manejar(texto.value); });
            btnAdjuntar.addEventListener('click', () => archivo.click());
            btnCamara.addEventListener('click', () => camara.click());

            // ---------- arranque ----------
            // Identificación POR SESIÓN (decisión de seguridad): sin sesión,
            // pantalla de acceso aquí mismo; nunca se pide la matrícula por chat.
            const perfil = await LuxV2.getProfile();
            if (!perfil) {
                barra.hidden = true;
                msgs.innerHTML =
                    '<div class="lumix-login">' +
                    '<img src="assets/lumix.png" alt="Lumix">' +
                    '<h1>¡Hola! Soy Lumix</h1>' +
                    '<p>Para ayudarte necesito saber quién eres. Inicia sesión con tu cuenta institucional.</p>' +
                    '<div id="auth-error" class="v2-auth-error" role="alert" style="max-width:320px; text-align:left;">' +
                    '<span style="margin-top:1px;">' + svgIcono('ui.alerta', 'media') + '</span>' +
                    '<span>Credenciales incorrectas. Verifica tu correo y contraseña.</span></div>' +
                    '<form id="auth-form">' +
                    '<div class="v2-field"><label class="v2-lbl" for="l-usr">Matrícula o correo institucional</label>' +
                    '<div class="v2-box">' + svgIcono('ui.persona') + '<input id="l-usr" type="text" autocomplete="username" required></div></div>' +
                    '<div class="v2-field"><label class="v2-lbl" for="l-pwd">Contraseña</label>' +
                    '<div class="v2-box">' + svgIcono('ui.candado') + '<input id="l-pwd" type="password" autocomplete="current-password" required></div></div>' +
                    '<button type="submit" id="l-entrar" class="v2-btn grande">Entrar con Lumix</button>' +
                    '</form>' +
                    '<a href="alumnos.html" style="font-size:13px; font-weight:700;">Ir al Portal del Estudiante</a>' +
                    '</div>';
                $('auth-form').addEventListener('submit', async (ev) => {
                    ev.preventDefault();
                    $('auth-error').classList.remove('abierta');
                    $('l-entrar').disabled = true;
                    try {
                        const r = await LuxV2.sb().auth.signInWithPassword({
                            email: $('l-usr').value.trim(),
                            password: $('l-pwd').value,
                        });
                        if (r.error) throw r.error;
                        location.reload();
                    } catch (_) {
                        $('l-entrar').disabled = false;
                        $('auth-error').classList.add('abierta');
                    }
                });
                return;
            }
            state.perfil = perfil;
            barra.hidden = false;
            $('btn-reiniciar').hidden = false;
            try { state.catalogs = await LuxV2.getCatalogs(); } catch (e) { console.warn('catalogos:', e); }
            diaChip();
            prompt('GREETING');
        })();
    </script>
</body>

</html>
