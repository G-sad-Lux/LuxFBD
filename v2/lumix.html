<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumix | Asistente de Soporte</title>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://aftrxnerszxjfjxegjuk.supabase.co; connect-src 'self' https://aftrxnerszxjfjxegjuk.supabase.co wss://aftrxnerszxjfjxegjuk.supabase.co ws://127.0.0.1:5173 ws://localhost:5173; object-src 'none'; base-uri 'self'; form-action 'self'">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        /* Chat Lumix: movil primero (fig. 4); en escritorio, columna centrada */
        html, body { height: 100%; }
        body { display: flex; flex-direction: column; background: var(--v2-bg); }
        .lumix-app { flex: 1; display: flex; flex-direction: column; max-width: 520px; width: 100%; margin: 0 auto; background: var(--v2-card); box-shadow: var(--v2-shadow); min-height: 0; }
        @media (min-width: 560px) { .lumix-app { margin: 16px auto; border-radius: 16px; overflow: hidden; border: 1px solid var(--v2-border); min-height: calc(100vh - 32px); max-height: calc(100vh - 32px); } }

        .lumix-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: linear-gradient(120deg, var(--v2-primary-dark), var(--v2-primary)); color: #fff; }
        .lumix-head .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #3ad6c9, #7fe3f0); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex: none; }
        .lumix-head .quien { flex: 1; line-height: 1.2; }
        .lumix-head .quien small { opacity: .85; font-size: .72rem; display: flex; align-items: center; gap: 5px; }
        .lumix-head .quien small::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #4ade80; }
        .lumix-head button { background: rgba(255,255,255,.15); border: none; color: #fff; border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; }
        .lumix-head button[hidden] { display: none !important; }

        .lumix-msgs { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; background: #f4f7fc; min-height: 0; }
        .msg { max-width: 85%; padding: 10px 13px; border-radius: 14px; font-size: .93rem; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
        .msg.bot { background: #fff; border: 1px solid var(--v2-border); align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg.user { background: var(--v2-primary); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; max-width: 95%; }
        .chips button { border: 1.5px solid var(--v2-primary); color: var(--v2-primary); background: #fff; border-radius: 999px; padding: 7px 14px; font: inherit; font-size: .86rem; font-weight: 600; cursor: pointer; }
        .chips button:hover { background: #e8f0ff; }
        .chips.usadas button { opacity: .45; pointer-events: none; }

        .card-exito { align-self: stretch; background: #fff; border: 1px solid var(--v2-border); border-left: 4px solid var(--v2-ok); border-radius: 12px; padding: 14px; }
        .card-exito h3 { margin: 0 0 4px; color: var(--v2-ok); font-size: 1rem; }
        .card-exito .folio { font-size: 1.15rem; font-weight: 600; }
        .card-exito p { margin: 4px 0 0; font-size: .85rem; color: var(--v2-muted); }

        .lumix-input { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--v2-border); background: var(--v2-card); }
        .lumix-input input[type="text"] { flex: 1; padding: 11px 13px; border: 1px solid var(--v2-border); border-radius: 999px; font: inherit; background: #f4f7fc; }
        .lumix-input button { border: none; border-radius: 999px; width: 44px; height: 44px; font-size: 1.05rem; cursor: pointer; background: #eef2fb; }
        .lumix-input button#btn-enviar { background: var(--v2-primary); color: #fff; }
        .lumix-input button:disabled { opacity: .4; cursor: default; }
    </style>
</head>

<body>
    <div class="lumix-app">
        <header class="lumix-head">
            <button id="btn-atras" aria-label="Atrás" hidden>←</button>
            <div class="avatar">👽</div>
            <div class="quien"><strong>Lumix</strong><small>En línea · asistente de soporte</small></div>
            <button id="btn-cerrar" aria-label="Salir" title="Ir a Mis Tickets">✕</button>
        </header>
        <div class="lumix-msgs" id="msgs"></div>
        <div class="lumix-input">
            <button id="btn-adjuntar" title="Adjuntar evidencia" disabled>📎</button>
            <input type="file" id="archivo" accept="image/png,image/jpeg,application/pdf" hidden>
            <input type="text" id="texto" placeholder="Escribe un mensaje…" maxlength="5000" disabled>
            <button id="btn-enviar" disabled>➤</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"
        integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF"
        crossorigin="anonymous"></script>
    <script src="../config.js"></script>
    <script src="shared.js"></script>
    <script>
        (async function () {
            if (!LuxV2.requireV2()) return;

            const esc = LuxV2.esc;
            const $ = (id) => document.getElementById(id);
            const msgs = $('msgs'), texto = $('texto'), btnEnviar = $('btn-enviar'),
                btnAdjuntar = $('btn-adjuntar'), archivo = $('archivo'), btnAtras = $('btn-atras');

            // Respaldo estático por si catalog-service no responde (mismos IDs de la semilla)
            const CATS_FALLBACK = [
                { catalogo_id: 37, nombre: 'Acceso y bloqueos' }, { catalogo_id: 34, nombre: 'Plataforma virtual' },
                { catalogo_id: 36, nombre: 'Materias' }, { catalogo_id: 42, nombre: 'Servicios escolares' },
                { catalogo_id: 33, nombre: 'Finanzas y pagos' }, { catalogo_id: 35, nombre: 'Otros' },
            ];
            const AREAS_FALLBACK = [
                { catalogo_id: 38, nombre: 'Soporte Técnico' }, { catalogo_id: 39, nombre: 'Servicios Escolares' },
                { catalogo_id: 40, nombre: 'Cajas' }, { catalogo_id: 41, nombre: 'Administración' },
            ];

            // Maquina de estados del asistente (formato chatbot: NO cambiar a formularios).
            // Orden §5.3 del doc V2: titulo -> categoria -> detalles -> area -> evidencias.
            // Sin pregunta de prioridad (§10): la fija soporte.
            const FLUJO = ['GREETING', 'TITLE', 'CATEGORY', 'DETAILS', 'AREA', 'EVIDENCE'];
            const state = { step: 'INIT', ticket: {}, catalogs: null, subiendo: false };

            // ---------- primitivas de chat ----------
            function burbuja(textoMsg, quien) {
                const d = document.createElement('div');
                d.className = 'msg ' + quien;
                d.textContent = textoMsg;
                msgs.appendChild(d);
                msgs.scrollTop = msgs.scrollHeight;
                return d;
            }
            function chips(opciones) {
                const c = document.createElement('div');
                c.className = 'chips';
                opciones.forEach(op => {
                    const b = document.createElement('button');
                    b.textContent = op.label;
                    b.addEventListener('click', () => {
                        c.classList.add('usadas'); // las opciones ya usadas se apagan
                        manejar(op.value, op.label);
                    });
                    c.appendChild(b);
                });
                msgs.appendChild(c);
                msgs.scrollTop = msgs.scrollHeight;
            }
            function habilitarTexto(si, conAdjunto) {
                texto.disabled = !si;
                btnEnviar.disabled = !si;
                btnAdjuntar.disabled = !conAdjunto;
                if (si) texto.focus();
            }
            function apagarChipsPrevios() {
                msgs.querySelectorAll('.chips:not(.usadas)').forEach(c => c.classList.add('usadas'));
            }

            // ---------- pasos ----------
            function prompt(step) {
                state.step = step;
                btnAtras.hidden = (step === 'GREETING' || step === 'DONE');
                habilitarTexto(false, false);
                switch (step) {
                    case 'GREETING':
                        state.ticket = {};
                        burbuja('¡Hola! Soy Lumix, tu asistente de soporte. ¿En qué puedo ayudarte hoy?', 'bot');
                        chips([
                            { label: '📝 Reportar un problema', value: 'report' },
                            { label: '🔎 Consultar mis tickets', value: 'status' },
                        ]);
                        break;
                    case 'TITLE':
                        burbuja('Perfecto. Escribe un título breve para tu incidencia (mínimo 5 letras).', 'bot');
                        habilitarTexto(true, false);
                        break;
                    case 'CATEGORY': {
                        burbuja('¿Qué tipo de problema tienes?', 'bot');
                        const cats = (state.catalogs && state.catalogs.categorias.length ? state.catalogs.categorias : CATS_FALLBACK);
                        chips(cats.map(c => ({ label: c.nombre, value: 'cat:' + c.catalogo_id })));
                        break;
                    }
                    case 'DETAILS':
                        burbuja('Cuéntame los detalles: qué pasó, desde cuándo y qué mensaje ves (mínimo 15 letras).', 'bot');
                        habilitarTexto(true, false);
                        break;
                    case 'AREA': {
                        burbuja('¿El problema se relaciona con algún área en específico? (opcional)', 'bot');
                        const areas = (state.catalogs && state.catalogs.areas.length ? state.catalogs.areas : AREAS_FALLBACK);
                        chips(areas.map(a => ({ label: a.nombre, value: 'area:' + a.catalogo_id }))
                            .concat([{ label: 'Que soporte lo decida', value: 'area:auto' }]));
                        break;
                    }
                    case 'EVIDENCE':
                        burbuja('¿Quieres adjuntar una evidencia? (imagen PNG/JPG o PDF, máx. 5 MB)', 'bot');
                        habilitarTexto(false, true);
                        chips([
                            { label: '📎 Adjuntar archivo', value: 'adjuntar' },
                            { label: 'Continuar sin evidencia', value: 'sin_adjunto' },
                        ]);
                        break;
                }
            }

            function atras() {
                const i = FLUJO.indexOf(state.step);
                if (i > 1) { apagarChipsPrevios(); prompt(FLUJO[i - 1]); }
                else if (i === 1) { apagarChipsPrevios(); prompt('GREETING'); }
            }

            async function manejar(valor, etiqueta) {
                if (state.subiendo) return;
                switch (state.step) {
                    case 'GREETING':
                        if (valor === 'report') { burbuja(etiqueta || 'Reportar un problema', 'user'); prompt('TITLE'); }
                        else if (valor === 'status') { burbuja(etiqueta || 'Consultar mis tickets', 'user'); consultarEstado(); }
                        else if (valor === 'salir') { window.location.href = 'alumnos.html'; }
                        break;
                    case 'TITLE': {
                        const t = String(valor).trim();
                        if (t.length < 5) { burbuja('El título es muy corto: dame al menos 5 letras.', 'bot'); return; }
                        state.ticket.titulo = t;
                        burbuja(t, 'user'); texto.value = '';
                        prompt('CATEGORY');
                        break;
                    }
                    case 'CATEGORY':
                        if (String(valor).startsWith('cat:')) {
                            state.ticket.categoria_id = Number(String(valor).slice(4));
                            burbuja(etiqueta, 'user');
                            prompt('DETAILS');
                        }
                        break;
                    case 'DETAILS': {
                        const d = String(valor).trim();
                        if (d.length < 15) { burbuja('Necesito un poco más de detalle (mínimo 15 letras) para ayudarte mejor.', 'bot'); return; }
                        state.ticket.detalles = d;
                        burbuja(d, 'user'); texto.value = '';
                        prompt('AREA');
                        break;
                    }
                    case 'AREA':
                        if (String(valor).startsWith('area:')) {
                            const v = String(valor).slice(5);
                            state.ticket.area_id = v === 'auto' ? null : Number(v);
                            burbuja(etiqueta, 'user');
                            prompt('EVIDENCE');
                        }
                        break;
                    case 'EVIDENCE':
                        if (valor === 'adjuntar') { archivo.click(); }
                        else if (valor === 'sin_adjunto') { burbuja('Continuar sin evidencia', 'user'); crearTicket(); }
                        break;
                    case 'DONE':
                        if (valor === 'report') { apagarChipsPrevios(); burbuja('Reportar otro problema', 'user'); state.ticket = {}; prompt('TITLE'); }
                        else if (valor === 'status') { apagarChipsPrevios(); burbuja('Consultar mis tickets', 'user'); consultarEstado(); }
                        else if (valor === 'mis_tickets') { window.location.href = 'alumnos.html'; }
                        else if (valor === 'salir') { window.location.href = 'alumnos.html'; }
                        break;
                }
            }

            // ---------- evidencia (sube al bucket privado, guarda la ruta) ----------
            archivo.addEventListener('change', async () => {
                if (!archivo.files.length) return;
                const f = archivo.files[0];
                archivo.value = '';
                const tipos = ['image/png', 'image/jpeg', 'application/pdf'];
                if (!tipos.includes(f.type)) { burbuja('Ese formato no está permitido: usa PNG, JPG o PDF.', 'bot'); return; }
                if (f.size > 5 * 1024 * 1024) { burbuja('El archivo pesa más de 5 MB. Comprime la imagen o recorta el PDF.', 'bot'); return; }

                state.subiendo = true;
                const aviso = burbuja('Subiendo ' + f.name + '…', 'bot');
                try {
                    const session = await LuxV2.getSession();
                    const limpio = f.name.replace(/[^\w.-]/g, '');
                    const ruta = session.user.id + '/' + Date.now() + '_' + limpio;
                    const { error } = await LuxV2.sb().storage.from('tickets').upload(ruta, f);
                    if (error) throw error;
                    state.ticket.adjunto = { nombre_archivo: f.name, ruta_archivo_url: ruta, mime_type: f.type, size_bytes: f.size };
                    aviso.textContent = '📎 Evidencia lista: ' + f.name;
                    state.subiendo = false;
                    apagarChipsPrevios();
                    burbuja('Adjunté "' + f.name + '"', 'user');
                    crearTicket();
                } catch (e) {
                    console.error(e);
                    state.subiendo = false;
                    aviso.textContent = 'No pude subir el archivo. Intenta de nuevo o continúa sin evidencia.';
                }
            });

            // ---------- crear ticket ----------
            async function crearTicket() {
                state.step = 'CREANDO';
                btnAtras.hidden = true;
                habilitarTexto(false, false);
                burbuja('Registrando tu reporte…', 'bot');
                try {
                    const body = {
                        titulo: state.ticket.titulo,
                        categoria_id: state.ticket.categoria_id,
                        detalles: state.ticket.detalles,
                        canal_entrada: 'chatbot',
                        adjunto: state.ticket.adjunto || null,
                    };
                    if (state.ticket.area_id) body.area_notificada_id = state.ticket.area_id;
                    const t = await LuxV2.callFn('ticket-manager/create', { method: 'POST', body });

                    const card = document.createElement('div');
                    card.className = 'card-exito';
                    card.innerHTML =
                        '<h3>✅ Reporte registrado correctamente</h3>' +
                        '<div class="folio">Ticket #' + esc(t.ticket_id) + ' · <span class="v2-badge st-abierto">Abierto</span></div>' +
                        '<p>Hemos recibido tu reporte y te notificaremos cada avance.</p>' +
                        (t.eta_estimada ? '<p>Atención estimada para: <strong>' + esc(LuxV2.ui.fmtFecha(t.eta_estimada)) + '</strong></p>' : '');
                    msgs.appendChild(card);
                    msgs.scrollTop = msgs.scrollHeight;

                    state.step = 'DONE';
                    burbuja('¿Necesitas algo más?', 'bot');
                    chips([
                        { label: '📂 Ver mis tickets', value: 'mis_tickets' },
                        { label: '📝 Reportar otro', value: 'report' },
                        { label: '🔎 Consultar estado', value: 'status' },
                    ]);
                } catch (err) {
                    console.error(err);
                    state.step = 'EVIDENCE';
                    burbuja('No pude registrar el ticket: ' + err.message, 'bot');
                    chips([
                        { label: 'Reintentar', value: 'sin_adjunto' },
                        { label: '📂 Ir a Mis Tickets', value: 'mis_tickets' },
                    ]);
                }
            }

            // ---------- consultar estado ----------
            async function consultarEstado() {
                state.step = 'DONE';
                btnAtras.hidden = true;
                burbuja('Déjame revisar tus tickets…', 'bot');
                try {
                    const tickets = await LuxV2.callFn('ticket-manager/list');
                    if (tickets.length === 0) {
                        burbuja('Aún no tienes tickets registrados. ¿Reportamos tu primer problema?', 'bot');
                    } else {
                        burbuja('Tienes ' + tickets.length + ' ticket(s):', 'bot');
                        tickets.slice(0, 5).forEach(t => {
                            const estado = t.estado ? t.estado.nombre : 'Desconocido';
                            const asignado = t.asignado ? ' · atiende ' + LuxV2.ui.nombreDe(t.asignado) : ' · sin asignar';
                            burbuja('#' + t.ticket_id + ' "' + t.titulo + '" → ' + estado + asignado, 'bot');
                        });
                        if (tickets.length > 5) burbuja('…y ' + (tickets.length - 5) + ' más en tu panel.', 'bot');
                    }
                } catch (e) {
                    console.error(e);
                    burbuja('No pude consultar tus tickets en este momento.', 'bot');
                }
                burbuja('¿Algo más?', 'bot');
                chips([
                    { label: '📝 Reportar un problema', value: 'report' },
                    { label: '📂 Ver mis tickets', value: 'mis_tickets' },
                ]);
            }

            // ---------- wiring ----------
            btnEnviar.addEventListener('click', () => manejar(texto.value));
            texto.addEventListener('keypress', (e) => { if (e.key === 'Enter') manejar(texto.value); });
            btnAdjuntar.addEventListener('click', () => archivo.click());
            btnAtras.addEventListener('click', atras);
            $('btn-cerrar').addEventListener('click', () => { window.location.href = 'alumnos.html'; });

            // ---------- arranque ----------
            const sesion = await LuxV2.getSession();
            if (!sesion) {
                burbuja('¡Hola! Soy Lumix 👽. Para ayudarte necesito saber quién eres.', 'bot');
                const c = document.createElement('div');
                c.className = 'chips';
                const a = document.createElement('a');
                a.className = 'v2-btn';
                a.href = '../index.html?volver=lumix';
                a.textContent = 'Iniciar sesión';
                c.appendChild(a);
                msgs.appendChild(c);
                return;
            }
            try { state.catalogs = await LuxV2.getCatalogs(); } catch (e) { console.warn('catalogos:', e); }
            prompt('GREETING');
        })();
    </script>
</body>

</html>
