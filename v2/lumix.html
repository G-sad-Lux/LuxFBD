<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumix | Asistente de Soporte</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1f4d'/%3E%3Cpath d='M10 7h4v14h8v4H10z' fill='%23fff'/%3E%3C/svg%3E">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://aftrxnerszxjfjxegjuk.supabase.co; connect-src 'self' https://aftrxnerszxjfjxegjuk.supabase.co wss://aftrxnerszxjfjxegjuk.supabase.co ws://127.0.0.1:5173 ws://localhost:5173; object-src 'none'; base-uri 'self'; form-action 'self'">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        /* Marco del chat a pantalla completa (celular / flujo QR). El motor y
           sus estilos viven en lumix-chat.js + shared.css; en PC el mismo
           motor va embebido en el panel de Mis Tickets (captura 03d). */
        html, body { height: 100%; }
        body { display: flex; flex-direction: column; background: var(--v2-bg); }
        .lumix-app { flex: 1; display: flex; flex-direction: column; max-width: 480px; width: 100%; margin: 0 auto; background: var(--v2-bg); min-height: 0; }
        @media (min-width: 520px) { .lumix-app { margin: 16px auto; border-radius: 18px; overflow: hidden; border: 1px solid var(--v2-border); min-height: calc(100vh - 32px); max-height: calc(100vh - 32px); box-shadow: 0 10px 40px rgba(11, 31, 77, .08); } }

        .lumix-head { display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 4px; background: var(--v2-card); border-bottom: 1px solid #e1e7f0; flex-shrink: 0; }
        .lumix-head .volver { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--v2-heading); }
        .lumix-head .avatar { position: relative; flex-shrink: 0; }
        .lumix-head .avatar img { width: 42px; height: 42px; border-radius: 50%; background: #ddf1f6; object-fit: cover; display: block; }
        .lumix-head .avatar .punto { position: absolute; right: 0; bottom: 1px; width: 11px; height: 11px; border-radius: 50%; background: var(--v2-ok); border: 2px solid #fff; }
        .lumix-head .quien { flex: 1; min-width: 0; line-height: 1.25; }
        .lumix-head .quien strong { font-size: 16px; color: var(--v2-heading); display: flex; align-items: center; gap: 8px; }
        /* Etiqueta DEMO del modo invitado (spec 02a) */
        .demo-pill { background: #fdecd8; color: #9a4a00; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 800; letter-spacing: .4px; }
        .lumix-head .quien small { font-size: 12px; color: #1f7a45; font-weight: 600; }
        .lumix-head .reiniciar { width: 44px; height: 44px; border: 0; background: transparent; color: var(--v2-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 10px; font: inherit; }
        .lumix-head .reiniciar:hover { background: #eef2f8; }

        #zona { flex: 1; display: flex; flex-direction: column; min-height: 0; }

        /* Acceso sin sesión (parte del flujo QR: se inicia sesión aquí mismo) */
        .lumix-login { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px 20px; text-align: center; }
        .lumix-login img { width: 132px; height: auto; }
        .lumix-login h1 { margin: 0; font-size: 24px; font-weight: 800; color: var(--v2-heading); }
        .lumix-login p { margin: 0; font-size: 14px; color: var(--v2-muted); max-width: 300px; }
        .lumix-login form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; text-align: left; }
        /* 16px en móvil: evita el zoom automático de iOS al enfocar */
        @media (max-width: 900px) { .lumix-login .v2-box { height: 50px; } .lumix-login .v2-box input { font-size: 16px; } }
    </style>
</head>

<body>
    <div class="lumix-app">
        <header class="lumix-head">
            <a class="volver" href="alumnos.html" aria-label="Volver al portal"><span data-ico="ui.atras" data-tam="grande"></span></a>
            <div class="avatar">
                <img src="assets/lumix-avatar.png" alt="">
                <span class="punto"></span>
            </div>
            <div class="quien"><strong>Lumix</strong><small>En línea · Soporte Universidad Lux</small></div>
            <button type="button" id="btn-reiniciar" class="reiniciar" aria-label="Reiniciar conversación" hidden><span data-ico="ui.historial"></span></button>
        </header>
        <div id="zona"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"
        integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF"
        crossorigin="anonymous"></script>
    <script src="../config.js"></script>
    <script src="iconos.js"></script>
    <script src="shared.js"></script>
    <script src="lumix-chat.js"></script>
    <script>
        (async function () {
            if (!LuxV2.requireV2()) return;

            const $ = (id) => document.getElementById(id);
            const { svgIcono } = LuxV2.ui;
            document.querySelectorAll('[data-ico]').forEach(el => {
                el.innerHTML = svgIcono(el.dataset.ico, el.dataset.tam || '');
            });
            const zona = $('zona');
            const quiereInvitado = /(?:^|[?&])invitado=/.test(location.search);

            // ---- Acceso sin sesión: cuenta institucional o modo INVITADO (D5) ----
            function pantallaLogin() {
                zona.innerHTML =
                    '<div class="lumix-login">' +
                    '<img src="assets/lumix.png" alt="Lumix">' +
                    '<h1>¡Hola! Soy Lumix</h1>' +
                    '<p>Para ayudarte necesito saber quién eres. Inicia sesión con tu cuenta institucional.</p>' +
                    '<div id="auth-error" class="v2-auth-error" role="alert" style="max-width:320px; text-align:left;">' +
                    '<span style="margin-top:1px;">' + svgIcono('ui.alerta', 'media') + '</span>' +
                    '<span>Credenciales incorrectas. Verifica tu correo y contraseña.</span></div>' +
                    '<form id="auth-form">' +
                    '<div class="v2-field"><label class="v2-lbl" for="l-usr">Correo institucional</label>' +
                    '<div class="v2-box">' + svgIcono('ui.persona') + '<input id="l-usr" type="text" autocomplete="username" required></div></div>' +
                    '<div class="v2-field"><label class="v2-lbl" for="l-pwd">Contraseña</label>' +
                    '<div class="v2-box">' + svgIcono('ui.candado') + '<input id="l-pwd" type="password" autocomplete="current-password" required></div></div>' +
                    '<button type="submit" id="l-entrar" class="v2-btn grande">Entrar con Lumix</button>' +
                    '</form>' +
                    '<button type="button" id="ir-invitado" class="v2-btn secundario" style="width:100%; max-width:320px;">Entrar como invitado (demo)</button>' +
                    '<a href="alumnos.html" style="font-size:13px; font-weight:700;">Ir al Portal del Estudiante</a>' +
                    '</div>';
                $('auth-form').addEventListener('submit', async (ev) => {
                    ev.preventDefault();
                    $('auth-error').classList.remove('abierta');
                    $('l-entrar').disabled = true;
                    try {
                        const r = await LuxV2.sb().auth.signInWithPassword({
                            email: $('l-usr').value.trim(),
                            password: $('l-pwd').value,
                        });
                        if (r.error) throw r.error;
                        location.reload();
                    } catch (_) {
                        $('l-entrar').disabled = false;
                        $('auth-error').classList.add('abierta');
                    }
                });
                $('ir-invitado').addEventListener('click', pantallaInvitado);
            }

            // Formulario del invitado: matrícula de 6 dígitos + nombre completo.
            // Crea una sesión ANÓNIMA con esos datos en el metadata (el trigger
            // 0019 los persiste en usuario); RLS lo acota a lo suyo.
            function pantallaInvitado() {
                zona.innerHTML =
                    '<div class="lumix-login">' +
                    '<img src="assets/lumix.png" alt="Lumix">' +
                    '<h1 style="display:flex; align-items:center; gap:8px; justify-content:center;">Modo invitado <span class="demo-pill">DEMO</span></h1>' +
                    '<p>Cuéntame quién eres para acompañarte: tu matrícula de 6 dígitos y tu nombre completo.</p>' +
                    '<div id="inv-error" class="v2-auth-error" role="alert" style="max-width:320px; text-align:left;">' +
                    '<span style="margin-top:1px;">' + svgIcono('ui.alerta', 'media') + '</span>' +
                    '<span id="inv-error-txt">Revisa los datos.</span></div>' +
                    '<form id="inv-form">' +
                    '<div class="v2-field"><label class="v2-lbl" for="i-mat">Matrícula (6 dígitos)</label>' +
                    '<div class="v2-box">' + svgIcono('ui.persona') + '<input id="i-mat" type="text" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]{6}" placeholder="123456" required></div></div>' +
                    '<div class="v2-field"><label class="v2-lbl" for="i-nom">Nombre completo</label>' +
                    '<div class="v2-box">' + svgIcono('ui.persona') + '<input id="i-nom" type="text" autocomplete="name" maxlength="80" placeholder="Nombre y apellido" required></div></div>' +
                    '<button type="submit" id="i-entrar" class="v2-btn grande">Comenzar con Lumix</button>' +
                    '</form>' +
                    '<p style="font-size:12px; color:var(--v2-muted); max-width:300px;">Sesión temporal solo para el demo: tus reportes quedan ligados a esta visita.</p>' +
                    '<button type="button" id="ir-cuenta" style="background:none; border:none; padding:0; font:inherit; font-size:13px; font-weight:700; color:var(--v2-primary); cursor:pointer; text-decoration:underline;">Ya tengo cuenta: iniciar sesión</button>' +
                    '</div>';
                const error = (txt) => {
                    $('inv-error-txt').textContent = txt;
                    $('inv-error').classList.add('abierta');
                };
                $('inv-form').addEventListener('submit', async (ev) => {
                    ev.preventDefault();
                    $('inv-error').classList.remove('abierta');
                    const mat = $('i-mat').value.trim();
                    const nom = $('i-nom').value.trim().replace(/\s+/g, ' ');
                    if (!/^\d{6}$/.test(mat)) return error('La matrícula debe tener exactamente 6 dígitos.');
                    if (nom.length < 5 || nom.split(' ').length < 2) return error('Escribe tu nombre completo (nombre y apellido).');
                    const partes = nom.split(' ');
                    $('i-entrar').disabled = true;
                    try {
                        const r = await LuxV2.sb().auth.signInAnonymously({
                            options: { data: { nombre: partes[0], apellido: partes.slice(1).join(' '), tipo_usuario: 'Alumno', matricula: mat } },
                        });
                        if (r.error) throw r.error;
                        location.reload();
                    } catch (e) {
                        console.error(e);
                        $('i-entrar').disabled = false;
                        error('El modo invitado no está disponible en este momento. Intenta de nuevo o inicia sesión.');
                    }
                });
                $('ir-cuenta').addEventListener('click', pantallaLogin);
            }

            // Identificación POR SESIÓN (decisión de seguridad): sin sesión,
            // acceso aquí mismo; nunca se pide la matrícula DENTRO del chat.
            const perfil = await LuxV2.getProfile();
            if (!perfil) {
                (quiereInvitado ? pantallaInvitado : pantallaLogin)();
                return;
            }
            // Etiqueta DEMO en el encabezado para sesiones de invitado
            if (perfil.esInvitado) {
                document.querySelector('.lumix-head .quien strong').innerHTML = 'Lumix <span class="demo-pill">DEMO</span>';
            }

            let catalogs = null;
            try { catalogs = await LuxV2.getCatalogs(); } catch (e) { console.warn('catalogos:', e); }

            const chat = LuxLumixChat.montar({
                raiz: zona, perfil, catalogs, modo: 'pantalla',
                alVerTicket: (id) => { window.location.href = 'alumnos.html' + (id ? '#ticket=' + id : ''); },
            });
            $('btn-reiniciar').hidden = false;
            $('btn-reiniciar').addEventListener('click', () => {
                if (chat.enCurso() && !confirm('¿Reiniciar la conversación? Se pierde el reporte a medio llenar.')) return;
                chat.reiniciar();
            });
        })();
    </script>
</body>

</html>
