<!doctype html>
<html lang="es">
<head>

<title>Lumix demo · identificado</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F2F5FA}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0E1A33;background:#F2F5FA}
*{box-sizing:border-box}
a{color:#1A56C4}a:hover{color:#15479F}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.grp{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:flex-end}
.av{width:30px;height:30px;border-radius:50%;background:#DDF1F6;object-fit:cover;flex-shrink:0}
.bot{background:#FFFFFF;border:1px solid #E1E7F0;border-radius:4px 16px 16px 16px;padding:10px 13px;font-size:14px;line-height:1.45;max-width:272px;color:#0E1A33}
.me{align-self:flex-end;background:#1A56C4;color:#FFFFFF;border-radius:16px 4px 16px 16px;padding:10px 13px;font-size:14px;line-height:1.45;max-width:270px}
.t{font-size:11px;color:#66728B;margin-top:4px}
.tr{font-size:11px;color:#66728B;align-self:flex-end;margin-top:-6px;display:flex;gap:4px;align-items:center}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-left:38px}
.chip{min-height:44px;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 10px;border:1px solid #BFD0EE;border-radius:12px;background:#FFFFFF;color:#15479F;font:inherit;font-size:13px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}
.chip:hover{background:#EAF1FC}
.chip.p{background:#1A56C4;border-color:#1A56C4;color:#FFFFFF}
.chip.p:hover{background:#15479F;color:#FFFFFF}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700}
.kv{display:grid;grid-template-columns:84px minmax(0,1fr);gap:4px 10px;font-size:13px}
.kv dt{color:#4B5874}.kv dd{margin:0;font-weight:600}
.ib{width:44px;height:44px;border:0;background:transparent;color:#4B5874;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:10px}
</style>


</head>
<body>
<div style="width: 390px; height: 844px; overflow: hidden">
  

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F2F5FA; overflow: hidden">
  <header style="height: 68px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 4px; background: #FFFFFF; border-bottom: 1px solid #E1E7F0">
    
      <a href="01-alumnos-login.html" aria-label="Volver al portal" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0B1F4D"><svg class="i" width="22" height="22" viewBox="0 0 24 24"><path d="M19 12H5 M11 6l-6 6 6 6"></path></svg></a>
    
    
    <div style="position: relative">
      <img src="../assets/lumix-avatar.png" alt="" style="width: 42px; height: 42px; border-radius: 50%; background: #DDF1F6; object-fit: cover">
      <span style="position: absolute; right: 0; bottom: 1px; width: 11px; height: 11px; border-radius: 50%; background: #1F8A4C; border: 2px solid #FFFFFF"></span>
    </div>
    <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
      <div style="display: flex; align-items: center; gap: 8px"><strong style="font-size: 16px; color: #0B1F4D">Lumix</strong><span style="height: 20px; padding: 0 8px; border-radius: 999px; background: #FDECD8; color: #9A4A00; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; letter-spacing: .4px">DEMO</span></div>
      <span style="font-size: 12px; color: #1F7A45; font-weight: 600">En línea · Soporte Universidad Lux</span>
    </div>
    <button type="button" class="ib" aria-label="Reiniciar conversación"><svg class="i" width="20" height="20" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7 M3 4v5h5"></path></svg></button>
  </header>

  <div style="flex-grow: 1; display: flex; flex-direction: column-reverse; overflow-y: auto">
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 14px 18px">
      <div style="align-self: center; font-size: 11px; font-weight: 700; color: #4B5874; background: #E4E9F1; border-radius: 999px; padding: 4px 10px">Hoy</div>

      <div class="grp">
        <div class="row"><img class="av" src="../assets/lumix-avatar.png" alt=""><div><div class="bot">¡Hola! Soy Lumix, tu asistente de soporte. Para comenzar, escribe tu matrícula.</div><div class="t">10:31</div></div></div>
        <div style="margin-left: 38px; display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: #FFF4E5; border: 1px dashed #D98B2B; font-size: 12px; line-height: 1.45; color: #7A3D00"><svg class="i" width="16" height="16" viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 11v5 M12 8v.01"></path></svg><span>Versión demo: basta con tu matrícula, sin contraseña.</span></div>
      </div>
      <div class="grp">
        <div class="me">A012345</div>
        <div class="tr">10:31<svg class="i" width="14" height="14" viewBox="0 0 24 24" style="color: #1A56C4"><path d="M2 12.5l4 4 8-9 M10 16.5l1 0 8-9"></path></svg></div>
        <div class="row"><img class="av" src="../assets/lumix-avatar.png" alt=""><div><div class="bot">Gracias. Te identifiqué como <strong>Juan Pérez López</strong> (A012345). ¿En qué puedo ayudarte hoy?</div><div class="t">10:31</div></div></div>
      </div>
      
      <div class="grp">
        <div class="chips">
          <button type="button" class="chip p"><svg class="i" width="18" height="18" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z M14 3v4h4 M9 12h6 M9 16h6"></path></svg>Reportar un problema</button>
          <button type="button" class="chip"><svg class="i" width="18" height="18" viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z M20 20l-4-4"></path></svg>Consultar mi ticket</button>
        </div>
      </div>

      

      

      
      

      

      
      

      
      

      
      

      
    </div>
  </div>

  <form style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 12px 14px; background: #FFFFFF; border-top: 1px solid #E1E7F0">
    <div style="flex-grow: 1; display: flex; align-items: center; gap: 4px; height: 48px; padding: 0 6px 0 14px; border: 1px solid #CBD5E4; border-radius: 999px; background: #F7F9FC; min-width: 0">
      <label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Mensaje para Lumix</label>
      <input id="msg" type="text" placeholder="Escribe un mensaje…" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: #0E1A33">
      <button type="button" aria-label="Adjuntar archivo" style="width: 36px; height: 36px; border: 0; background: transparent; color: #4B5874; display: flex; align-items: center; justify-content: center"><svg class="i" width="20" height="20" viewBox="0 0 24 24"><path d="M20 11.5l-8 8a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7L9.7 17.2a1.7 1.7 0 0 1-2.4-2.4L15 7"></path></svg></button>
      <button type="button" aria-label="Tomar foto" style="width: 36px; height: 36px; border: 0; background: transparent; color: #4B5874; display: flex; align-items: center; justify-content: center"><svg class="i" width="20" height="20" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z M12 16.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"></path></svg></button>
    </div>
    <button type="submit" aria-label="Enviar mensaje" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #FFFFFF; background: #9DB0D3"><svg class="i" width="20" height="20" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z M11.5 13.5L20 4"></path></svg></button>
  </form>
</div>

</div>
</body>
</html>
