<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso móvil</title>
<!-- Referencia visual estática exportada del diseño (Claude Design). No es código de producción. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0E1A33;background:#FFFFFF}
*{box-sizing:border-box}
a{color:#1A56C4}a:hover{color:#15479F}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.lbl{font-size:13px;font-weight:600;color:#26324D}
.box{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border:1px solid #CBD5E4;border-radius:12px;background:#fff;color:#66728B}
.box:focus-within{border-color:#1A56C4;box-shadow:0 0 0 3px #D6E4FA}
.box input{border:0;outline:0;flex-grow:1;font:inherit;font-size:16px;color:#0E1A33;background:transparent;min-width:0}
.box input::placeholder{color:#7A859C}
</style>


</head>
<body>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FFFFFF; overflow: hidden">
  <div style="background: #0B1F4D; padding: 36px 24px 28px; display: flex; flex-direction: column; gap: 18px; position: relative; overflow: hidden">
    <img src="../assets/logo-lux-blanco.png" alt="Universidad Lux" style="width: 168px; height: auto">
    <div style="display: flex; flex-direction: column; gap: 6px; max-width: 220px">
      <h1 style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 800; color: #FFFFFF">Portal de Atención al Estudiante</h1>
      <span style="width: 32px; height: 3px; background: #E8731C; border-radius: 2px; margin-top: 6px"></span>
    </div>
    <img src="../assets/lumix.png" alt="" style="position: absolute; right: -6px; bottom: -34px; width: 132px; height: auto">
  </div>

  <form style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 26px 24px 20px">
    <p style="margin: 0; font-size: 15px; color: #4B5874">Inicia sesión para ver y dar seguimiento a tus tickets.</p>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label class="lbl" for="m-usr">Matrícula o correo institucional</label>
      <div class="box"><svg class="i" width="20" height="20" viewBox="0 0 24 24"><path d="M4 6h16v12H4z M4 7l8 6 8-6"></path></svg><input id="m-usr" type="text" placeholder="A012345" autocomplete="username"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label class="lbl" for="m-pwd">Contraseña</label>
      <div class="box"><svg class="i" width="20" height="20" viewBox="0 0 24 24"><path d="M6 11h12v9H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3"></path></svg><input id="m-pwd" type="password" placeholder="Tu contraseña" autocomplete="current-password"><button type="button" aria-label="Mostrar contraseña" style="border: 0; background: transparent; color: #4B5874; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><svg class="i" width="20" height="20" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z M12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"></path></svg></button></div>
      <a href="#" style="align-self: flex-end; font-size: 13px; font-weight: 600">¿Olvidaste tu contraseña?</a>
    </div>
    <a href="09-movil-mis-tickets.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 12px; background: #1A56C4; color: #FFFFFF; font-weight: 700; font-size: 16px; text-decoration: none">Ingresar<svg class="i" width="18" height="18" viewBox="0 0 24 24"><path d="M5 12h14 M13 6l6 6-6 6"></path></svg></a>
    <div style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: #66728B"><span style="flex-grow: 1; height: 1px; background: #E4E9F1"></span>o también<span style="flex-grow: 1; height: 1px; background: #E4E9F1"></span></div>
    <a href="02a-lumix-demo-matricula.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 12px; border: 1px solid #BFD0EE; background: #FFFFFF; color: #15479F; font-weight: 700; font-size: 15px; text-decoration: none"><img src="../assets/lumix-avatar.png" alt="" style="width: 28px; height: 28px; border-radius: 50%; background: #DDF1F6">Reportar con Lumix</a>
    <p style="margin: auto 0 0; text-align: center; font-size: 13px; color: #4B5874">¿Primera vez aquí? <a href="#" style="font-weight: 700">Crea tu cuenta</a></p>
  </form>
</div>
</body>
</html>
