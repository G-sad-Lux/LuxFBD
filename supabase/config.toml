# Configuracion del CLI de Supabase (npx supabase ...)
# El ref del proyecto remoto se fija con `npx supabase link --project-ref <ref>`.
project_id = "LuxFBD"

[functions.ticket-manager]
verify_jwt = true

[functions.catalog-service]
# Se llama antes del login sin token: la plataforma responde 401 y el frontend
# cae a los mapas estaticos (IDs sembrados en 0002). Mismo comportamiento que la v1.
# Cuando la fase 2 mueva loadCatalogs() a despues del login, funcionara con token.
verify_jwt = true

[auth]
# --- VENTANA DE DEMO (D5, 2026-09-26) ---
# El modo invitado necesita el signup GLOBAL encendido (GoTrue bloquea lo
# anonimo si esta apagado). OJO: [auth.email].enable_signup = false apaga el
# proveedor completo (¡tambien los LOGINS!), asi que NO sirve para cerrar F1.
# Mitigacion durante la ventana: confirmaciones de correo OBLIGATORIAS, con
# el mailer compartido de Supabase limitado a ~2 correos/hora; un alta por
# correo queda sin sesion hasta confirmar.
# ROLLBACK POST-DEMO (restaura F1 exacta):
#   enable_signup = false, enable_anonymous_sign_ins = false  ->  config push
enable_signup = true
minimum_password_length = 10
enable_anonymous_sign_ins = true

[auth.email]
# true = el proveedor email queda ACTIVO (logins del personal y alumnos).
enable_signup = true
# Alta por correo sin confirmar no inicia sesion (mitigacion F1 del demo).
enable_confirmations = true
